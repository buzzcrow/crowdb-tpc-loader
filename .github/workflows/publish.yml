name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release branch and package version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          expected_ref = f'refs/heads/release/v{version}'
          assert os.environ['RELEASE_REF'] == expected_ref, f'Expected {expected_ref}'
          PY
      - name: Install
        run: "python -m pip install --only-binary=:all: -e '.[dev,sql-test]'"
      - name: Lint, format, and test
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m pytest -q
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
