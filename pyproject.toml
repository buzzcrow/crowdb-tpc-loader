[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdb-tpc-loader"
version = "0.1.0rc1"
description = "Generate and safely load TPC-H and TPC-DS Parquet datasets into an Iceberg REST catalog"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "CrowDB contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "botocore>=1.34,<2",
  "pyarrow>=18,<24",
  "duckdb>=1.4,<1.6",
  "pyiceberg[pyarrow]>=0.10,<0.11",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1.2,<2", "ruff>=0.11,<1"]
sql-test = ["sqlalchemy>=2,<3"]

[project.scripts]
crowdb-tpc-loader = "crowdb_tpc_loader.cli:main"

[project.urls]
Repository = "https://github.com/buzzcrow/crowdb-tpc-loader"
Issues = "https://github.com/buzzcrow/crowdb-tpc-loader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "integration: requires installed runtime dependencies",
  "generator: invokes the real generator (may download binaries/extensions)",
  "crowdb: writes a fresh namespace in an explicitly configured CrowDB instance",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
